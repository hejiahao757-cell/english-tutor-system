name: Restore organized handoff snapshot

on:
  push:
    branches: [main]
    paths:
      - "archives/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild compressed snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -d archives/handoff-chunks
          cat $(find archives/handoff-chunks -type f -name 'part-*' | sort) | base64 --decode > /tmp/english-tutor-handoff.tar.gz
          echo "dc39c8e1c5f12eae3011ae29fc1c7257a576c4e11607c4cf67561dbadc46bf17  /tmp/english-tutor-handoff.tar.gz" | sha256sum -c -

      - name: Extract organized project files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/english-tutor-handoff.tar.gz -C . --strip-components=1
          rm -rf archives/handoff-chunks

      - name: Commit restored files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Restore organized English tutor project snapshot"
            git push
          fi
