name: Verify English Learning System

on:
  push:
    branches: [main]
    paths:
      - "apps/english-learning-system/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/english-learning-system/**"
      - ".github/workflows/ci.yml"

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/english-learning-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/english-learning-system/package-lock.json
      - run: npm ci
      - run: npm run build

